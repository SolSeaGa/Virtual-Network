[General]
#!include Configuration.dconf

[Ponte]
#!include Configuration.dconf

[Proxy Group]
# PROXY & FINAL
Proxy = select, DIRECT, HK, TW, JP, SG, US, Edge, Online, AnyTLS, VLESS, category=Rule, icon-url=B1::Astrology::Fire
Final = select, DIRECT, HK, TW, JP, SG, US, Edge, Online, AnyTLS, VLESS, category=Rule, icon-url=B1::Industry::Water
# 苹果 & 推送通知服务
APNs = select, DIRECT, HK, TW, JP, SG, US, Edge, Online, AnyTLS, VLESS, category=Rule, icon-url=B1::Farming::Apple
Apple = select, DIRECT, HK, TW, JP, SG, US, Edge, Online, AnyTLS, VLESS, category=Rule, icon-url=B1::Plants::Bitten Apple
# 流媒体策略组
Streaming = select, DIRECT, HK, TW, JP, SG, US, Edge, Online, AnyTLS, VLESS, category=Rule, icon-url=B1::Music::Disco Ball
Film = select, DIRECT, HK, TW, JP, SG, US, Edge, Online, AnyTLS, VLESS, category=Rule, icon-url=B1::Music::Disco Ball
# 游戏策略组
Arcade = select, DIRECT, HK, TW, JP, SG, US, Edge, Online, AnyTLS, VLESS, category=Rule, icon-url=B1::Gaming::Game Controller
# 智能策略组
Intelligence = fallback, include-other-group="Online, AnyTLS, VLESS", policy-regex-filter=AI, category=Rule, icon-url=B1::Science::Artificial Intelligence, no-alert=0, hidden=0, include-all-proxies=0
# 地区策略组
HK = smart, include-other-group="Online, AnyTLS, VLESS", policy-regex-filter=HK, category=Region, icon-url=B1::Maps::World Map(3), policy-priority=Private:0.8;Public:1.2
TW = smart, include-other-group="Online, AnyTLS, VLESS", policy-regex-filter=TW, category=Region, icon-url=B1::Maps::World Map(3)
JP = smart, include-other-group="Online, AnyTLS, VLESS", policy-regex-filter=JP, category=Region, icon-url=B1::Maps::World Map(3)
SG = smart, include-other-group="Online, AnyTLS, VLESS", policy-regex-filter=SG, category=Region, icon-url=B1::Maps::World Map(3)
US = smart, include-other-group="Online, AnyTLS, VLESS", policy-regex-filter=US, category=Region, icon-url=B1::Maps::World Map(3), policy-priority=Private:0.8;Public:1.2
Edge = select, include-other-group="Online, AnyTLS, VLESS", policy-regex-filter=^(?!.*(HK|TW|JP|SG|US|AI)).*$, category=Region, icon-url=B1::Maps::World Map
# 本地订阅文件
AnyTLS = select, policy-path=Subscribe/AnyTLS.dconf, category=Subscribe, icon-url=B1::Messaging::Inbox(5)
VLESS = select, policy-path=Subscribe/VLESS.dconf, category=Subscribe, icon-url=B1::Messaging::Inbox(5)
# 远程订阅文件
Online = select, policy-path=https://sub.store/download/collection/Fries, category=Subscribe, icon-url=B1::Messaging::Inbox(5)

[Rule]
#!include Configuration.dconf

